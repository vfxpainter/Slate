<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no maximum-scale: locking zoom stops anyone enlarging text they cannot read -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Sulat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app" data-pane="list" data-view-mode="list">

  <!-- ============ SIDEBAR : folders ============ -->
  <aside class="pane pane-nav" id="paneNav">
    <header class="pane-head">
      <button class="icon-btn only-narrow" data-act="nav-close" title="Close">&#10005;</button>
      <div class="brand">Sulat</div>
      <button class="icon-btn" data-act="new-folder" title="New folder">&#43;</button>
    </header>
    <nav class="nav-scroll" id="folderTree"></nav>
    <footer class="pane-foot">
      <button class="ghost-btn" data-act="open-transfer">Backup &amp; transfer</button>
      <button class="ghost-btn" data-act="open-fonts">Text &amp; font</button>
      <button class="ghost-btn" data-act="toggle-theme" id="themeBtn">Theme</button>
      <div class="storage-line" id="storageLine"></div>
    </footer>
  </aside>

  <!-- The tabs: down the left on a PC, along the bottom on a phone. Filled in
       by app.js; only shown in the new layout. -->
  <nav class="tabbar" id="tabBar" aria-label="Sections"></nav>

  <!-- ============ LIST : notes in current folder ============ -->
  <section class="pane pane-list" id="paneList">
    <header class="pane-head">
      <button class="icon-btn only-narrow" data-act="nav-open" title="Folders">&#9776;</button>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false">
      </div>
      <button class="icon-btn" data-act="cycle-view" id="viewBtn" title="View: list / grid / large grid">&#9707;</button>
      <button class="icon-btn" data-act="toggle-select" id="selectBtn" title="Select notes">&#9744;</button>
      <button class="new-here" data-act="new-here" id="newHere" hidden><span class="nh-plus">&#43;</span><span class="nh-label">New note</span></button>
      <div class="new-menu">
        <button class="icon-btn primary" data-act="new-menu" title="New">&#43;</button>
        <div class="menu" id="newMenu" hidden>
          <button data-act="new" data-type="text"><b>Note</b><span>Long-form writing</span></button>
          <button data-act="new" data-type="list"><b>List</b><span>Reorder &amp; cross out</span></button>
          <button data-act="new" data-type="mindmap"><b>Mindmap</b><span>Quick node sketch</span></button>
        </div>
      </div>
    </header>

    <!-- bulk actions, shown only while selecting -->
    <div class="select-bar" id="selectBar" hidden>
      <span class="sel-count" id="selCount">0 selected</span>
      <button class="ghost-btn" data-act="sel-all">All</button>
      <button class="ghost-btn" data-act="sel-none">None</button>
      <button class="ghost-btn" data-act="sel-move">Move to folder…</button>
      <button class="ghost-btn" data-act="sel-tag">Tag…</button>
      <button class="ghost-btn" data-act="sel-pin">Pin</button>
      <button class="ghost-btn" data-act="sel-export">Export…</button>
      <button class="ghost-btn danger" data-act="sel-trash">Trash</button>
      <button class="ghost-btn" data-act="toggle-select">Done</button>
    </div>

    <!-- Three ways to start, all in reach. The plus menu above still works;
         this row is for not having to open it. -->
    <div class="new-row" id="newRow" hidden>
      <button class="new-chip" data-act="new" data-type="text">
        <span class="nc-ico k-text">&#9998;</span>Note</button>
      <button class="new-chip" data-act="new" data-type="list">
        <span class="nc-ico k-list">&#9745;</span>List</button>
      <button class="new-chip" data-act="new" data-type="mindmap">
        <span class="nc-ico k-mindmap">&#10021;</span>Mindmap</button>
    </div>

    <div class="list-bar">
      <button class="icon-btn up-btn back-btn" data-act="tab-up" id="upBtn" title="Back" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></button>
      <div class="list-title" id="listTitle"></div>
      <select class="sort-select" id="sortBy" title="Sort notes">
        <option value="edited">Last edited</option>
        <option value="oldest">Oldest edit</option>
        <option value="created">Newest first</option>
        <option value="az">Title A–Z</option>
        <option value="za">Title Z–A</option>
        <option value="type">Type</option>
      </select>
    </div>
    <div class="note-scroll" id="noteList"></div>
  </section>

  <div class="resizer" data-resize="nav" title="Drag to resize · double-click to reset"></div>
  <div class="resizer" data-resize="list" title="Drag to resize · double-click to reset"></div>
  <div class="rubber" id="rubber" hidden></div>

  <!-- ============ EDITOR ============ -->
  <main class="pane pane-editor" id="paneEditor">
    <header class="pane-head">
      <button class="icon-btn only-narrow back-btn" data-act="editor-back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></button>
      <button class="folder-chip" data-act="move" id="editorCrumb" title="Move to another folder"></button>
      <div class="undo-pair">
        <button class="icon-btn" data-act="undo" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="icon-btn" data-act="redo" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
      </div>
      <button class="icon-btn" data-act="add-image" title="Add image">&#128247;</button>
      <div class="zoom-pair" id="zoomPair">
        <button class="icon-btn" data-act="zoom-out" title="Smaller text (Ctrl+-)" aria-label="Smaller text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6"/></svg>
        </button>
        <button class="icon-btn" data-act="zoom-in" title="Bigger text (Ctrl++)" aria-label="Bigger text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8 11h6M11 8v6"/></svg>
        </button>
      </div>
      <button class="icon-btn" data-act="toggle-full" id="fullBtn"
              title="Full screen (Esc to leave)">&#11036;</button>
      <button class="icon-btn" data-act="note-menu" title="More">&#8942;</button>
      <div class="menu node-menu" id="nodeMenu" hidden>
        <button data-act="map-rename"><b>Edit text</b></button>
        <button data-act="map-child"><b>Add child</b></button>
        <button data-act="map-copy"><b>Copy</b></button>
        <button data-act="map-paste"><b>Paste</b></button>
        <button data-act="map-duplicate"><b>Duplicate</b></button>
        <button data-act="map-del" class="danger"><b>Delete</b></button>
      </div>
      <div class="menu menu-right" id="noteMenu" hidden>
        <button data-act="pin"><b>Pin / unpin</b></button>
        <button data-act="move"><b>Move to folder…</b></button>
        <button data-act="export-note"><b>Export this note…</b></button>
        <button data-act="pages"><b>Pages…</b><span>More than one sheet in this note</span></button>
        <button data-act="duplicate"><b>Duplicate</b></button>
        <button data-act="add-tag"><b>Add a tag…</b><span>Labels that cut across folders</span></button>
        <button data-act="lock"><b>Lock note…</b><span>Encrypt it behind a passphrase</span></button>
        <button data-act="unlock" class="locked-item"><b>Unlock note…</b></button>
        <button data-act="trash" class="danger"><b>Move to trash</b></button>
        <button data-act="restore" class="hidden-item"><b>Restore</b></button>
        <button data-act="purge" class="danger hidden-item"><b>Delete forever</b></button>
      </div>
    </header>
    <div class="hit-bar" id="hitBar" hidden>
      <span id="hitCount"></span>
      <button class="icon-btn" data-act="hit-prev" title="Previous match" aria-label="Previous match">&#8593;</button>
      <button class="icon-btn" data-act="hit-next" title="Next match" aria-label="Next match">&#8595;</button>
      <button class="icon-btn" data-act="hit-clear" title="Stop highlighting" aria-label="Stop highlighting">&#10005;</button>
    </div>
    <div class="editor-scroll" id="editorScroll">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">&#9634;</div>
        <p>Pick a note, or start a new one.</p>
      </div>
      <div class="editor-body" id="editorBody" hidden>
        <!-- a textarea, not an input: an input is single-line, so a long title
             scrolled sideways off a phone screen instead of wrapping -->
        <textarea class="note-title" id="noteTitle" placeholder="Title" rows="1"
                  autocomplete="off" spellcheck="false" autocapitalize="words"></textarea>
        <button class="page-chip" data-act="pages" id="pageChip" hidden></button>
        <div class="note-meta" id="noteMeta"></div>
        <div class="tag-row" id="tagRow"></div>
        <div class="gallery" id="gallery"></div>

        <!-- locked -->
        <div class="locked-panel" id="lockedPanel" hidden>
          <div class="lock-mark">&#128274;</div>
          <p>This note is locked. Its contents are encrypted on this device.</p>
          <button class="btn solid" data-act="unlock">Unlock…</button>
        </div>

        <!-- text -->
        <div class="note-text note-rich" id="noteRich" contenteditable="true"
             spellcheck="true" data-placeholder="Write…"></div>
        <div class="img-grip" id="imgGrip" hidden title="Drag to resize"></div>
        <div class="img-bar" id="imgBar" hidden>
          <button data-act="img-align" data-align="left" title="Text wraps down the right">
            <svg viewBox="0 0 20 16" aria-hidden="true"><rect class="f" x="1" y="3" width="8" height="10" rx="1"/><g class="l"><rect x="11" y="4" width="8" height="1.5" rx=".75"/><rect x="11" y="7.5" width="8" height="1.5" rx=".75"/><rect x="11" y="11" width="5" height="1.5" rx=".75"/></g></svg>
          </button>
          <button data-act="img-align" data-align="center" title="Centred, text above and below">
            <svg viewBox="0 0 20 16" aria-hidden="true"><g class="l"><rect x="1" y="1" width="18" height="1.5" rx=".75"/></g><rect class="f" x="5" y="4" width="10" height="8" rx="1"/><g class="l"><rect x="1" y="13.5" width="18" height="1.5" rx=".75"/></g></svg>
          </button>
          <button data-act="img-align" data-align="right" title="Text wraps down the left">
            <svg viewBox="0 0 20 16" aria-hidden="true"><rect class="f" x="11" y="3" width="8" height="10" rx="1"/><g class="l"><rect x="1" y="4" width="8" height="1.5" rx=".75"/><rect x="1" y="7.5" width="8" height="1.5" rx=".75"/><rect x="1" y="11" width="5" height="1.5" rx=".75"/></g></svg>
          </button>
          <button data-act="img-align" data-align="full" title="Full width">
            <svg viewBox="0 0 20 16" aria-hidden="true"><rect class="f" x="1" y="3" width="18" height="10" rx="1"/></svg>
          </button>
          <span class="img-bar-sep"></span>
          <button data-act="img-free" id="imgFreeBtn" title="Free placement — drag anywhere, text ignores it">
            <svg viewBox="0 0 20 16" aria-hidden="true"><g class="l"><rect x="1" y="2" width="18" height="1.5" rx=".75"/><rect x="1" y="12.5" width="18" height="1.5" rx=".75"/></g><rect class="f" x="6" y="5" width="9" height="7" rx="1"/></svg>
          </button>
          <span class="img-bar-sep"></span>
          <button data-act="img-lock" id="imgLockBtn" title="Unlock to move this image">
            <svg viewBox="0 0 20 16" aria-hidden="true"><g class="lock-shut"><rect class="f" x="4" y="7" width="12" height="8" rx="1.5"/><path d="M7 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></g><g class="lock-open" style="display:none"><rect class="f" x="4" y="7" width="12" height="8" rx="1.5"/><path d="M7 7V5a3 3 0 0 1 5.6-1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></g></svg>
          </button>
          <span class="img-bar-sep"></span>
          <button data-act="img-smaller" title="Smaller">&#8722;</button>
          <span class="img-size" id="imgSize">50%</span>
          <button data-act="img-bigger" title="Bigger">&#43;</button>
          <span class="img-bar-sep"></span>
          <button data-act="img-remove" class="danger" title="Remove image">&#10005;</button>
        </div>

        <!-- list -->
        <div class="list-editor" id="listEditor" hidden>
          <button class="add-item top" data-act="add-item-top">&#43; Add item</button>
          <div class="items" id="listItems"></div>
          <button class="add-item" data-act="add-item">&#43; Add item</button>
          <div class="list-tools">
            <button class="ghost-btn" data-act="sweep-done">Move done to bottom</button>
            <button class="ghost-btn" data-act="clear-done">Clear done</button>
            <span class="sel-tag" id="itemSelCount" hidden></span>
            <span class="count" id="listCount"></span>
          </div>
        </div>

        <!-- mindmap -->
        <div class="map-editor" id="mapEditor" hidden>
          <div class="map-tools">
            <button class="ghost-btn" data-act="map-sibling">&#43; Sibling <kbd>Enter</kbd></button>
            <button class="ghost-btn" data-act="map-child">&#43; Child <kbd>Tab</kbd></button>
            <button class="ghost-btn" data-act="map-rename">Rename <kbd>Enter</kbd></button>
            <button class="ghost-btn" data-act="map-select-mode" id="selModeBtn">Select <kbd>drag</kbd></button>
            <button class="ghost-btn" data-act="map-link" id="linkBtn">Link <kbd>Ctrl+L</kbd></button>
            <button class="ghost-btn" data-act="map-image">&#128247; Image</button>
            <button class="ghost-btn" data-act="map-image-remove" hidden>Remove image</button>
            <button class="ghost-btn" data-act="map-copy">Copy <kbd>Ctrl+C</kbd></button>
            <button class="ghost-btn" data-act="map-paste">Paste <kbd>Ctrl+V</kbd></button>
            <button class="ghost-btn" data-act="map-duplicate">Duplicate <kbd>Ctrl+D</kbd></button>
            <button class="ghost-btn" data-act="map-unlink">Unlink</button>
            <button class="ghost-btn" data-act="map-del">Delete <kbd>Del</kbd></button>
            <button class="ghost-btn" data-act="map-zoom-out">&#8722;</button>
            <button class="ghost-btn" data-act="map-zoom-in">&#43;</button>
            <button class="ghost-btn" data-act="map-fit">Fit</button>
            <button class="ghost-btn" data-act="map-auto" id="autoBtn">Auto-arrange</button>
            <button class="ghost-btn" data-act="map-style-toggle" id="styleBtn">Style</button>
          </div>
          <div class="map-style">
            <div class="style-group">
              <span class="style-label">Colour</span>
              <div class="map-colors" id="mapColors" title="Colour the selected nodes"></div>
              <label class="swatch custom" id="customSwatch" title="Custom colour">
                <input type="color" id="customColor" value="#a8622f">
              </label>
              <button class="chip" data-act="map-tone-down" title="Less saturated">&#9680;</button>
              <button class="chip" data-act="map-tone-up" title="More saturated">&#9681;</button>
            </div>
            <div class="style-group">
              <span class="style-label">Shape</span>
              <div class="map-shapes" id="mapShapes" title="Shape of the selected nodes"></div>
            </div>
            <div class="style-group">
              <span class="style-label">Text</span>
              <button class="chip" data-act="map-font-smaller" title="Smaller text">A&#8722;</button>
              <span class="chip-val" id="mapFontVal">–</span>
              <button class="chip" data-act="map-font-bigger" title="Bigger text">A&#43;</button>
              <button class="chip" data-act="map-font-reset" title="Back to the app text size">Reset</button>
            </div>
            <div class="style-group">
              <span class="style-label">Spacing</span>
              <button class="chip" data-act="map-space-less" title="Closer together">&#8722;</button>
              <span class="chip-val" id="mapSpaceVal">52</span>
              <button class="chip" data-act="map-space-more" title="Further apart">&#43;</button>
            </div>
            <div class="style-group">
              <span class="style-label">Layout</span>
              <select id="mapLayout" title="Which way the map grows"></select>
            </div>
            <div class="style-group">
              <span class="style-label">Lines</span>
              <select id="mapEdgeType" title="Line style — applies to the selected link, or to all"></select>
              <button class="chip" data-act="map-line-thinner" title="Thinner">&#8722;</button>
              <span class="chip-val" id="mapLineVal">1.8</span>
              <button class="chip" data-act="map-line-thicker" title="Thicker">&#43;</button>
            </div>
            <span class="sel-tag" id="mapSelCount" hidden></span>
          </div>
          <div class="map-hint" id="mapHint"></div>
          <div class="map-canvas-wrap">
            <canvas id="mapCanvas"></canvas>
            <textarea id="mapInlineEdit" class="map-inline" spellcheck="false" hidden></textarea>
            <!-- the everyday buttons, where a thumb can reach them -->
            <div class="map-zoom" id="mapZoom" aria-hidden="true">100%</div>
            <div class="map-quick" id="mapQuick">
              <button class="quick-btn" data-act="map-child">&#43; Child</button>
              <button class="quick-btn" data-act="map-sibling">&#43; Sibling</button>
              <button class="quick-btn" data-act="map-rename">&#9998; Edit</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ dialogs ============ -->
<dialog id="dlg" class="dlg"><div class="dlg-inner" id="dlgInner"></div></dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="filePick" accept="image/*" multiple hidden>
<input type="file" id="bundlePick" accept=".gz,.json,.sulat" hidden>
<div id="printRoot" class="print-root"></div>
<div id="lightbox" class="lightbox" hidden><img id="lightboxImg" alt=""></div>

<script src="db.js"></script>
<script src="history.js"></script>
<script src="lock.js"></script>
<script src="mindmap.js"></script>
<script src="exporter.js"></script>
<script src="app.js"></script>
</body>
</html>
